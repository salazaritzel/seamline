spring:
  application:
    name: seamline
  config:
    # Lets ./mvnw spring-boot:run read the same .env file Docker Compose uses.
    # Optional, so it is skipped inside the container and in tests.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:seamline}
    username: ${POSTGRES_USER:seamline}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    # Flyway owns the schema. Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
