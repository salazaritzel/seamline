services:
  db:
    image: postgres:18
    env_file: .env
    ports:
      # Host port is configurable in case another Postgres already uses 5432.
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ keeps data in /var/lib/postgresql/18/docker, so mount the
      # parent directory. Mounting /var/lib/postgresql/data (the pre-18 path) breaks.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      # Inside the Compose network, the app reaches Postgres by service name on its internal port.
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
